# backlot-64 code overlay for region A: assembled for $8000, packed into an
# REU slot, DMA'd in by b64_overlay_load.  The first byte is the entry point.
# Region A is 6 KB: the multiplexer holds $9800-$9FFF.
MEMORY { OVA: start = $8000, size = $1800, file = %O; }
SEGMENTS { OVERLAY: load = OVA, type = ro; }
