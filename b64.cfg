# backlot-64 linker configuration.  Memory map: docs/PLAN.md section 5.
#
# Engine resident core at $0800-$2FFF, game resident at $3000-$3FFF.
# VIC bank 1 ($4000-$7FFF): screens, charset, sprite bank.
# Metatile library at $A000-$BFFF, properties at $C000.

MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw, define = yes;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    HEADER:   start = $0801, size = $000C, file = %O;
    ENGINE:   start = $080D, size = $27F3, file = %O, fill = yes, define = yes;   # to $2FFF, padded so GAME loads at $3000
    GAME:     start = $3000, size = $1000, file = %O, define = yes;   # to $3FFF
    LOWRAM:   start = $0200, size = $0600, type = rw;                 # tables, no file
    VICBANK:  start = $4000, size = $4000, type = rw;
    GAMEHI:   start = $6000, size = $2000, type = rw;
    OVERLAYA: start = $8000, size = $2000, type = rw;
    MTLIB:    start = $A000, size = $2000, type = rw;
    PROPS:    start = $C000, size = $0100, type = rw;
    PAGES:    start = $C100, size = $0800, type = rw;                 # page cache: 8 x 256-byte REU pages
    VMTABLE:  start = $C900, size = $0100, type = rw;                 # the VM's vector table, copied there at script start
    OVERLAYB: start = $CA00, size = $0600, type = rw;
    GAMETOP:  start = $E000, size = $1FFA, type = rw;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    CODE:     load = ENGINE,   type = ro;
    RODATA:   load = ENGINE,   type = ro;
    DATA:     load = ENGINE,   type = rw;
    PAGES:    load = PAGES,    type = bss, optional = yes;
    GAME:     load = GAME,     type = ro,  optional = yes;
    LOWRAM:   load = LOWRAM,   type = bss, optional = yes;
    GAMEHI:   load = GAMEHI,   type = bss, optional = yes;
    GAMETOP:  load = GAMETOP,  type = bss, optional = yes;
}
