# backlot-64 pinned module: loaded into the game's module region at $6000
# when play starts and resident until it ends (docs/MODULES.md section 3).
# The code first ($6000-$71FF), tables page-aligned at $7200, the module's
# data after, to $79FF; the body tables start at $7A00 (modules/physics/defs.inc).
MEMORY { PIN: start = $6000, size = $1A00, file = %O; }
SEGMENTS {
    OVERLAY: load = PIN, type = ro;
    PTAB:    load = PIN, type = ro, start = $7200;
    PDATA:   load = PIN, type = rw;
}
