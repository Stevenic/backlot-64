# backlot-64 pinned module: loaded into the game's module region at $6000
# when play starts and resident until it ends (docs/MODULES.md section 3).
# The code first, tables page-aligned at $7000, the module's data after.
MEMORY { PIN: start = $6000, size = $1C00, file = %O; }
SEGMENTS {
    OVERLAY: load = PIN, type = ro;
    PTAB:    load = PIN, type = ro, start = $7000;
    PDATA:   load = PIN, type = rw;
}
