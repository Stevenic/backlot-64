# backlot-64 C64 Ultimate module: assembled for overlay region B, packed as
# the ULTIMATE slot, fetched by b64_plat_probe when the machine has the
# sampler or the command interface (src/b64_ultimate.s).
MEMORY {
    OVB:  start = $CC00, size = $0380, file = %O;
    OVBD: start = $CF80, size = $0080;
}
SEGMENTS {
    ULTJMP: load = OVB, type = ro;
    CODE:   load = OVB, type = ro;
    LOWRAM: load = OVBD, type = bss;
}
